name: SwiftPay CI

on:
  push:
    branches: [main, master]

  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:

      # ==========================================
      # PostgreSQL
      # ==========================================
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: swiftpay
          POSTGRES_PASSWORD: swiftpay123
          POSTGRES_DB: swiftpay

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U swiftpay -d swiftpay"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      # ==========================================
      # Redis
      # ==========================================
      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      # ==========================================
      # Apache Kafka
      # ==========================================
      kafka:
        image: apache/kafka:3.9.1

        ports:
          - 9092:9092

        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 3

    # ==========================================
    # Environment variables
    # ==========================================
    env:
      DATABASE_URL: postgresql://swiftpay:swiftpay123@localhost:5432/swiftpay
      REDIS_URL: redis://localhost:6379
      KAFKA_BROKERS: localhost:9092
      NODE_ENV: test

    # ==========================================
    # Steps
    # ==========================================
    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # Check Node/npm versions
      # ==========================================
      - name: Check Node and npm versions
        run: |
          echo "Node version:"
          node --version

          echo "npm version:"
          npm --version

          echo "npm cache:"
          npm config get cache

      # ==========================================
      # Debug npm lockfile
      # ==========================================
      - name: Debug npm lockfile
        run: |
          echo "=== Git commit ==="
          git rev-parse HEAD

          echo "=== Branch ==="
          git branch --show-current

          echo "=== Root files ==="
          ls -la

          echo "=== package.json ==="
          node -e "const p=require('./package.json'); console.log(JSON.stringify({name:p.name,version:p.version,packageManager:p.packageManager,workspaces:p.workspaces},null,2))"

          echo "=== Lockfile version ==="
          node -e "const p=require('./package-lock.json'); console.log({lockfileVersion:p.lockfileVersion,name:p.name,version:p.version})"

          echo "=== emnapi entries ==="
          node -e "const p=require('./package-lock.json'); for (const k of Object.keys(p.packages||{})) if(k.includes('emnapi')) console.log(k,p.packages[k].version)"

          echo "=== npm version ==="
          npm --version

      # ==========================================
      # Install dependencies
      # ==========================================
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ==========================================
      # Verify installed dependencies
      # ==========================================
      - name: Verify dependencies
        run: |
          npm ls --depth=0
          npm ls @emnapi/core @emnapi/runtime || true

      # ==========================================
      # Prisma
      # ==========================================
      - name: Generate Prisma Client
        run: npx prisma generate

      # ==========================================
      # Database migrations
      # ==========================================
      - name: Run database migrations
        run: npx prisma migrate deploy

      # ==========================================
      # Wait for Kafka
      # ==========================================
      - name: Wait for Kafka
        run: |
          echo "Waiting for Kafka..."

          for i in {1..30}; do
            if nc -z localhost 9092; then
              echo "Kafka is ready!"
              exit 0
            fi

            echo "Kafka not ready yet..."
            sleep 2
          done

          echo "Kafka failed to start"
          exit 1

      # ==========================================
      # TypeScript type check
      # ==========================================
      - name: Type check
        run: npm run type-check --workspaces

      # ==========================================
      # Build
      # ==========================================
      - name: Build
        run: npm run build --workspaces

      # ==========================================
      # Tests
      # ==========================================
      - name: Run tests
        run: npm test --workspaces -- --runInBand