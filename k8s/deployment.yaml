apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-gateway
  template:
    metadata:
      labels:
        app: transaction-gateway
    spec:
      containers:
        - name: transaction-gateway
          image: swiftpay/transaction-gateway:latest
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              value: postgresql://swiftpay:swiftpay123@postgres:5432/swiftpay
            - name: REDIS_URL
              value: redis://redis:6379
            - name: KAFKA_BROKERS
              value: kafka:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
    spec:
      containers:
        - name: ledger-service
          image: swiftpay/ledger-service:latest
          ports:
            - containerPort: 3002
          env:
            - name: DATABASE_URL
              value: postgresql://swiftpay:swiftpay123@postgres:5432/swiftpay
            - name: REDIS_URL
              value: redis://redis:6379
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: KAFKA_RETRY_ATTEMPTS
              value: "5"
            - name: KAFKA_RETRY_INITIAL_DELAY_MS
              value: "1000"
            - name: KAFKA_RETRY_MAX_DELAY_MS
              value: "30000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
    spec:
      containers:
        - name: analytics-worker
          image: swiftpay/analytics-worker:latest
          ports:
            - containerPort: 3003
          env:
            - name: DATABASE_URL
              value: postgresql://swiftpay:swiftpay123@postgres:5432/swiftpay
            - name: KAFKA_BROKERS
              value: kafka:9092
